name: inventory-service
services:

  postgresql:
    container_name: postgresql
    image: postgres:18-alpine
    extra_hosts: [ 'host.docker.internal:host-gateway' ]
    environment:
      - POSTGRES_USER=appuser
      - POSTGRES_PASSWORD=secret
      - POSTGRES_DB=appdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: "pg_isready -U appuser -d appdb"
      interval: 2s
      timeout: 20s
      retries: 10
    networks:
      - inventory-network

  pgadmin:
    image: dpage/pgadmin4
    extra_hosts: [ 'host.docker.internal:host-gateway' ]
    environment:
      - PGADMIN_DEFAULT_EMAIL=pgadmin4@pgadmin.org
      - PGADMIN_DEFAULT_PASSWORD=admin
      - PGADMIN_CONFIG_SERVER_MODE=False
      - PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED=False
    ports:
      - "5050:80"
    depends_on:
      postgresql:
        condition: service_healthy
    volumes:
      - ./docker_pgadmin_servers.json:/pgadmin4/servers.json
    entrypoint:
      - "/bin/sh"
      - "-c"
      - "/bin/echo 'postgresql:5432:*:appuser:secret' > /tmp/pgpassfile && chmod 600 /tmp/pgpassfile && /entrypoint.sh"
    restart: unless-stopped
    networks:
      - inventory-network

  redis:
    container_name: redis
    image: 'redis:8.10.2-alpine'
    extra_hosts: [ 'host.docker.internal:host-gateway' ]
    ports:
      - '6379:6379'
    volumes:
      - 'redis_data:/data:rw'
    healthcheck:
      test: redis-cli ping
      interval: 3s
      timeout: 5s
      retries: 5
    networks:
      - inventory-network

  grafana-lgtm:
    image: grafana/otel-lgtm:0.36.0
    extra_hosts: ['host.docker.internal:host-gateway']
    container_name: grafana-lgtm
    depends_on:
      otel-collector:
        condition: service_started
    environment:
      - OTEL_METRIC_EXPORT_INTERVAL=500
      - ENABLE_LOGS_ALL=true # Enable logs for all components
    ports:
      - "3000:3000" # Grafana UI
      - "3200:3200" # OTLP HTTP receiver for logs
      - "4317:4317" # OTLP gRPC receiver
      - "4318:4318" # OTLP HTTP receiver
      - "9090:9090" # Prometheus metrics endpoint
    networks:
      - inventory-network

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.162.0
    container_name: otel-collector
    command: ["--config=/etc/otel-collector-config.yml"]
    volumes:
      - ../../deployment/config/otel-collector-config.yml:/etc/otel-collector-config.yml
    networks:
      - inventory-network

  kafka:
    container_name: kafka
    image: apache/kafka-native:4.3.1
    extra_hosts: [ 'host.docker.internal:host-gateway' ]
    hostname: broker
    ports:
      - "9092:9092"
    healthcheck:
      test: [ "CMD-SHELL", "nc -z localhost 9092 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_CONTROLLER_QUORUM_MODE: 'kraft'
      CLUSTER_ID: '4L6g3nShT-eMCtK--X86sw'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://broker:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: 32
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@broker:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://broker:29092,CONTROLLER://broker:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      # Additional configurations to ensure state cleanup
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_DELETE_TOPIC_ENABLE: 'true'
      KAFKA_AUTO_LEADER_REBALANCE_ENABLE: 'true'
    networks:
      - inventory-network

  config-server:
    container_name: config-server
    image: dockertmt/mmv2-config-server:0.0.1-SNAPSHOT
    extra_hosts: [ 'host.docker.internal:host-gateway' ]
    deploy:
      resources:
        limits:
          memory: 1400m
    ports:
      - "8888:8888"
    depends_on:
      grafana-lgtm:
        condition: service_started
      otel-collector:
        condition: service_started
    networks:
      - inventory-network
    environment:
      - SPRING_PROFILES_ACTIVE=native
      - SPRING_SECURITY_USER_NAME=docker-dev
      - SPRING_SECURITY_USER_PASSWORD=docker-pass
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_SERVICE_NAME=config-server
      - OTEL_RESOURCE_ATTRIBUTES=service.name=config-server,service.version=0.0.1-SNAPSHOT
      - JAVA_TOOL_OPTIONS=-XX:MaxDirectMemorySize=64M

  naming-server:
    container_name: naming-server
    image: dockertmt/mmv2-service-registry-25:0.0.1-SNAPSHOT
    extra_hosts: [ 'host.docker.internal:host-gateway' ]
    deploy:
      resources:
        limits:
          memory: 1400m
    ports:
      - "8761:8761"
    networks:
      - inventory-network
    depends_on:
      config-server:
        condition: service_started
      otel-collector:
        condition: service_started
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_CONFIG_IMPORT=configserver:http://docker-dev:docker-pass@config-server:8888/
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_SERVICE_NAME=naming-server
      - OTEL_RESOURCE_ATTRIBUTES=service.name=naming-server,service.version=0.0.1-SNAPSHOT
      - OTEL_INSTRUMENTATION_MICROMETER_ENABLED=true
      - JAVA_TOOL_OPTIONS=-XX:MaxDirectMemorySize=64M
    restart: unless-stopped

  api-gateway:
    container_name: api-gateway
    image: dockertmt/mmv2-api-gateway:0.0.1-SNAPSHOT
    extra_hosts: [ 'host.docker.internal:host-gateway' ]
    deploy:
      resources:
        limits:
          memory: 1400m
    ports:
      - "8765:8765"
    networks:
      - inventory-network
    depends_on:
      config-server:
        condition: service_started
      naming-server:
        condition: service_started
      grafana-lgtm:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_CONFIG_IMPORT=configserver:http://docker-dev:docker-pass@config-server:8888/
      - SPRING_DATA_REDIS_HOST=redis
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_SERVICE_NAME=api-gateway
      - OTEL_RESOURCE_ATTRIBUTES=service.name=api-gateway,service.version=0.0.1-SNAPSHOT
      - OTEL_INSTRUMENTATION_MICROMETER_ENABLED=true
      - JAVA_TOOL_OPTIONS=-javaagent:/workspace/BOOT-INF/classes/agent/opentelemetry-javaagent.jar -XX:MaxDirectMemorySize=256m -Xmx400m
    restart: unless-stopped

  catalog-service:
    container_name: catalog-service
    image: dockertmt/mmv2-catalog-service:0.0.1-SNAPSHOT
    extra_hosts: [ 'host.docker.internal:host-gateway' ]
    deploy:
      resources:
        limits:
          memory: 1400m
    ports:
      - "18080:18080"
    networks:
      - inventory-network
    depends_on:
      kafka:
        condition: service_healthy
      naming-server:
        condition: service_started
      config-server:
        condition: service_started
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_CONFIG_IMPORT=configserver:http://docker-dev:docker-pass@config-server:8888/
      - SPRING_DATA_REDIS_HOST=redis
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_SERVICE_NAME=catalog-service
      - OTEL_RESOURCE_ATTRIBUTES=service.name=catalog-service,service.version=0.0.1-SNAPSHOT
      - OTEL_INSTRUMENTATION_MICROMETER_ENABLED=true
      - JAVA_TOOL_OPTIONS=-javaagent:/workspace/BOOT-INF/classes/agent/opentelemetry-javaagent.jar -XX:MaxDirectMemorySize=256m -Xmx400m
    restart: unless-stopped

networks:
  inventory-network:

volumes:
  redis_data:
  postgres_data:
    driver: local
