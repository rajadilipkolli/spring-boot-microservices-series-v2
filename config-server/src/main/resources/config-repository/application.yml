eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
  instance:
    preferIpAddress: true

jdbc:
  datasource-proxy:
    include-parameter-values: false
    json-format: false
    logging: slf4j
    multiline: false
    query:
      enable-logging: true
      log-level: DEBUG
      logger-name: datasource-query-logger
  includes: connection,fetch,query
logging:
  level:
    datasource-query-logger: INFO
  pattern:
    correlation: '[%X{traceId:-},%X{spanId:-}]'
management:
  endpoint:
    health:
      probes:
        enabled: true
      show-components: always
      show-details: always
  endpoints:
    web:
      exposure:
        include: configprops,env,health,info,loggers,metrics,refresh,prometheus,circuitbreakers,ratelimiters
  info:
    env:
      enabled: true
    git:
      mode: full
    java:
      enabled: true
    os:
      enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true
        resilience4j:
          circuitbreaker:
            calls: true
  observations:
    annotations:
      enabled: true
    key-values:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        step: 10s
  tracing:
    sampling:
      probability: 1.0
server:
  shutdown: graceful
spring:
  datasource:
    hikari:
      auto-commit: false
      data-source-properties:
        ApplicationName: ${spring.application.name}
  jmx:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        connection:
          provider_disables_autocommit: true
        generate_statistics: false
        jdbc:
          batch_size: 25
          lob:
            non_contextual_creation: true
          time_zone: UTC
        order_inserts: true
        order_updates: true
        query:
          fail_on_pagination_over_collection_fetch: true
          in_clause_parameter_padding: true
          plan_cache_max_size: 4096
        session:
          events:
            log:
              LOG_QUERIES_SLOWER_THAN_MS: '5'
  lifecycle:
    timeout-per-shutdown-phase: 45s
  main:
    allow-bean-definition-overriding: true
  mvc:
    problemdetails:
      enabled: true
  output:
    ansi:
      enabled: ALWAYS
  threads:
    virtual:
      enabled: true

#SpringDoc Properties
springdoc:
  swagger-ui:
    #For sorting endpoints alphabetically
    operationsSorter: alpha
    #For sorting tags alphabetically
    tagsSorter: alpha
