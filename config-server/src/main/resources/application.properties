spring.application.name=configserver
server.port=8888
management.endpoints.web.exposure.include=*
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always

spring.profiles.include=native
spring.output.ansi.enabled=ALWAYS
spring.cloud.config.server.native.search-locations=classpath:/config-repository
spring.threads.virtual.enabled=true
#Disable Refresh for native build
spring.cloud.refresh.enabled=false

#Enabling Spring security
spring.security.user.name=${CONFIG_SERVER_USR:dev-usr}
spring.security.user.password=${CONFIG_SERVER_PWD:dev-pass}
logging.level.org.springframework.security=INFO
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
management.opentelemetry.logging.export.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/logs
management.tracing.sampling.probability=1.0
management.opentelemetry.resource-attributes.service.name=config-server
logging.pattern.correlation=[%X{traceId:-},%X{spanId:-}]
