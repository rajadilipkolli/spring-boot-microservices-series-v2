management:
  endpoint:
    gateway:
      access: READ_ONLY
    health:
      show-details: when_authorized
    metrics:
      tags:
        application: api-gateway
    prometheus:
      metrics:
        export:
          enabled: true
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - prometheus
  info:
    git:
      mode: full
server:
  port: 8765
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
          metrics:
            enabled: true
          global-filter:
            local-response-cache:
              enabled: false
          httpclient:
            connect-timeout: 1000
            response-timeout: 5s
            wiretap: false
          routes:
            - id: order-service
              predicates:
                - Path=/order-service/**
              uri: lb://order-service
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter:
                      replenishRate: 60
                      burstCapacity: 120
            - id: inventory-service
              predicates:
                - Path=/inventory-service/**
              uri: lb://inventory-service
              filters:
                - name: CircuitBreaker
                  args:
                    name: exampleSlowCircuitBreaker
                    fallbackUri: forward:/fallback/api/inventory
            - id: catalog-service
              predicates:
                - Path=/catalog-service/**
              filters:
                - name: Retry
                  args:
                    retries: 3
                    method: GET
                    backoff:
                      firstBackoff: 50ms
                      maxBackoff: 500ms
                      factor: 2
                      basedOnPreviousValue: true
              uri: lb://catalog-service
            - id: payment-service
              predicates:
                - Path=/payment-service/**
              uri: lb://payment-service
    refresh:
      enabled: false
  config:
    import: "optional:configserver:${CONFIG_SERVER:http://localhost:8888}/"
  webflux:
    problemdetails:
      enabled: true
#    base-path: /${spring.application.name}

springdoc:
  cache:
    disabled: true
# We should display api-gateway as well
  swagger-ui:
    urls[0]:
      name: api-gateway
      url: /v3/api-docs
# adding this so that List<groupedopenapi> bean will trigger
  group-configs[0]:
    group: api-gateway
    pathsToMatch: /**
#  packagesToScan: com.example.api.gateway.web



gateway:
  delay-between-services: 5s
  request-timeout: 10s
  workflow-timeout: 45s

  connection-timeout: 2s
  response-timeout: 8s
  pending-acquire-timeout: 2s

  max-idle-time: 30s
  max-life-time: 5m
  evict-in-background: 30s

  max-connections: 100

  service-urls:
    CATALOG: "http://CATALOG-SERVICE/catalog-service/api/catalog/generate"
    INVENTORY: "http://INVENTORY-SERVICE/inventory-service/api/inventory/generate"
    ORDER: "http://ORDER-SERVICE/order-service/api/orders/generate"
