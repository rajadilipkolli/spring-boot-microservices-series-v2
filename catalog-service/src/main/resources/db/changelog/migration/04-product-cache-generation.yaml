databaseChangeLog:
  - changeSet:
      id: product-cache-generation
      author: rajakolli
      context: Creates DDL Script for product_cache_generation
      preConditions:
        - onFail: MARK_RAN
          not:
            - tableExists:
                tableName: product_cache_generation
      changes:
        - createTable:
            tableName: product_cache_generation
            columns:
              - column:
                  name: id
                  type: INT
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: generation
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
        - insert:
            tableName: product_cache_generation
            columns:
              - column:
                  name: id
                  valueNumeric: '1'
              - column:
                  name: generation
                  value: 'initial'
