spring.application.name=payment-service
server.port=18085
server.servlet.contextPath= /${spring.application.name}

spring.config.import=optional:configserver:http://${CONFIG_SERVER_USR:dev-usr}:${CONFIG_SERVER_PWD:dev-pass}@${CONFIG_SERVER_HOST:localhost}:${CONFIG_SERVER_PORT:8888}/
spring.cloud.refresh.enabled=false
######## Kafka Configuration  #########
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.group.protocol=consumer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

spring.testcontainers.beans.startup= parallel
spring.threads.virtual.enabled=true
spring.jackson.deserialization.fail-on-unknown-properties=false

application.order-service-url=http://localhost:18282/order-service

application.operation.lease-duration=15s
application.operation.provider-timeout=3s
application.operation.statement-timeout=2s
application.operation.lock-timeout=2s
application.operation.max-attempts=3

application.outbox.enabled=true
application.outbox.publish-delay=500ms
application.outbox.lock-timeout=30s
application.outbox.max-retries=3
application.outbox.batch-size=100
application.outbox.send-timeout=5s

application.reconciler.enabled=true
application.reconciler.delay=1s
application.reconciler.batch-size=50
application.reconciler.initial-backoff=1s
application.reconciler.max-backoff=10s
