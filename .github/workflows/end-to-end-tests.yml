name: End-to-End Tests (Manual)
on:
  workflow_dispatch: # Allow manual triggering of the workflow
    inputs:
      command_args:
        description: 'Arguments to pass to test-em-all.sh'
        required: false
        default: 'start stop'
        type: string
  workflow_call: # Allow other workflows to trigger this workflow
    inputs:
      command_args:
        description: 'Arguments to pass to test-em-all.sh'
        required: false
        default: 'start stop'
        type: string
jobs:
  e2e-tests:
    name: Run End-to-End Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Start latency_analyzer.py in background (capture logs)
        id: start-analyzer
        run: |
          if [ -f .github/workflows/latency_analyzer.py ]; then
            nohup python3 .github/workflows/latency_analyzer.py > latency_analyzer.log 2>&1 &
            echo "analyzer_pid=$!" >> $GITHUB_OUTPUT
            echo "Started latency_analyzer.py with PID $!"
          else
            echo "analyzer_missing=true" >> $GITHUB_OUTPUT
            echo "latency_analyzer.py not found at .github/workflows/latency_analyzer.py"
          fi

      - name: Run End to End Tests
        run: ./test-em-all.sh --detailed-logs ${{ inputs.command_args || 'start stop' }}

      - name: Stop latency_analyzer.py and collect logs
        if: always()
        run: |
          echo "Collecting logs..."
          if [ "${{ steps.start-analyzer.outputs.analyzer_missing }}" = "true" ]; then
            echo "latency_analyzer.py was not present; no logs to collect" > latency_analyzer.log
          else
            if [ -n "${{ steps.start-analyzer.outputs.analyzer_pid }}" ]; then
              pid=${{ steps.start-analyzer.outputs.analyzer_pid }}
              echo "Stopping latency_analyzer.py PID $pid"
              kill $pid || true
              sleep 2
            else
              echo "No PID recorded; attempting to pkill by name"
              pkill -f latency_analyzer.py || true
              sleep 2
            fi
          fi
          echo "=== tail of latency_analyzer.log ==="
          tail -n +1 latency_analyzer.log || true

      - name: Upload latency_analyzer.log artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: latency-analyzer-logs
          path: latency_analyzer.log
          retention-days: 5