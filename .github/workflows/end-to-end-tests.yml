name: End-to-End Tests (Manual)
on:
  workflow_dispatch:
    inputs:
      compose_file:
        description: 'Docker compose file to use'
        required: false
        default: 'deployment/docker-compose.yml'
        type: string
      extra_maven_args:
        description: 'Additional Maven arguments for e2e-tests'
        required: false
        default: ''
        type: string
  workflow_call:
    inputs:
      compose_file:
        description: 'Docker compose file to use'
        required: false
        default: 'deployment/docker-compose.yml'
        type: string
      command_args:
        description: 'Legacy argument (maps setup/teardown to docker-compose-tools.yml)'
        required: false
        default: ''
        type: string
      extra_maven_args:
        description: 'Additional Maven arguments for e2e-tests'
        required: false
        default: ''
        type: string
jobs:
  e2e-tests:
    name: Run End-to-End Tests
    runs-on: ubuntu-latest
    env:
      COMPOSE_FILE: ${{ (contains(inputs.command_args, 'setup') || inputs.compose_file == 'deployment/docker-compose-tools.yml') && 'deployment/docker-compose-tools.yml' || inputs.compose_file || 'deployment/docker-compose.yml' }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.15'

      - name: Start latency_analyzer.py in background (capture logs)
        id: start-analyzer
        run: |
          if [ -f .github/workflows/latency_analyzer.py ]; then
            nohup python3 .github/workflows/latency_analyzer.py > latency_analyzer.log 2>&1 &
            echo "analyzer_pid=$!" >> $GITHUB_OUTPUT
            echo "Started latency_analyzer.py with PID $!"
          else
            echo "analyzer_missing=true" >> $GITHUB_OUTPUT
            echo "latency_analyzer.py not found at .github/workflows/latency_analyzer.py"
          fi

      - name: Start Services via Docker Compose
        run: |
          echo "Starting services using compose file: $COMPOSE_FILE"
          docker compose -f "$COMPOSE_FILE" --profile terraform up -d

      - name: Wait for Services to be Ready
        run: |
          echo "Waiting for API Gateway to be healthy..."
          timeout=240
          elapsed=0
          until curl -s http://localhost:8765/actuator/health | grep -q "UP"; do
            if [ $elapsed -ge $timeout ]; then
              echo "Timeout waiting for API Gateway to be healthy."
              docker compose -f "$COMPOSE_FILE" logs api-gateway
              exit 1
            fi
            sleep 5
            elapsed=$((elapsed + 5))
          done
          echo "API Gateway is UP."
          sleep 15

      - name: Run End to End Tests
        run: |
          TF_VAR_webapp_client_secret="${TF_VAR_webapp_client_secret:-${OAUTH2_CLIENT_SECRET:-demo-throwaway-oauth-secret}}"
          KEYCLOAK_RETAIL_PASSWORD="${KEYCLOAK_RETAIL_PASSWORD:-${RETAIL_PASSWORD:-demo-throwaway-retail-pass}}"
          ./mvnw test -pl e2e-tests -DskipE2E=false ${{ inputs.extra_maven_args || '' }} \
            "-Dkeycloak.client.secret=${TF_VAR_webapp_client_secret:-}" \
            "-Dkeycloak.password=${KEYCLOAK_RETAIL_PASSWORD:-}"

      - name: Publish E2E Test Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-test-reports
          path: e2e-tests/target/surefire-reports/

      - name: Stop Services via Docker Compose
        if: always()
        run: |
          echo "Stopping services for compose file: $COMPOSE_FILE"
          docker compose -f "$COMPOSE_FILE" --profile terraform down -v --remove-orphans

      - name: Collect Diagnostics
        if: failure()
        run: |
          set +e
          mkdir -p diagnostics
          docker ps -a > diagnostics/docker-ps.txt
          docker compose -f "$COMPOSE_FILE" logs > diagnostics/docker-compose.log
          for container in $(docker ps -a --format '{{.Names}}'); do
            docker logs $container > diagnostics/${container}.log 2>&1 || true
          done

      - name: Upload Diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-diagnostics
          path: diagnostics
          retention-days: 5

      - name: Stop latency_analyzer.py and collect logs
        if: always()
        run: |
          echo "Collecting logs..."
          if [ "${{ steps.start-analyzer.outputs.analyzer_missing }}" = "true" ]; then
            echo "latency_analyzer.py was not present; no logs to collect" > latency_analyzer.log
          else
            if [ -n "${{ steps.start-analyzer.outputs.analyzer_pid }}" ]; then
              pid=${{ steps.start-analyzer.outputs.analyzer_pid }}
              echo "Stopping latency_analyzer.py PID $pid"
              kill $pid || true
              sleep 2
            else
              echo "No PID recorded; attempting to pkill by name"
              pkill -f latency_analyzer.py || true
              sleep 2
            fi
          fi
          echo "=== tail of latency_analyzer.log ==="
          tail -n +1 latency_analyzer.log || true

      - name: Upload latency_analyzer.log artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: latency-analyzer-logs
          path: latency_analyzer.log
          retention-days: 5
