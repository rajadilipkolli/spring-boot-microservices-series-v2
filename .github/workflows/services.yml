name: services

# One workflow for all services. The `plan` job works out which services a push or
# pull request affects (from dynamic-monorepo.config.json) and only those are built,
# tested and, on main, published as Docker images.
on:
  push:
    branches: [main]
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.plan.outputs.build }}
      has_services: ${{ steps.plan.outputs.has_build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: Continuous-Actions/dynamic-monorepo@77762731c30b63136a6cd3b37e854a75febb7eeb
        id: plan

  build:
    name: ${{ matrix.service }} with jdk ${{ matrix.java }}
    needs: plan
    if: needs.plan.outputs.has_services == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_ACTOR: ${{ github.actor }}
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.plan.outputs.services) }}
        java: ["25"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis

      - uses: graalvm/setup-graalvm@f70bc8032f90a104502824a54bcb94b6f01715bc
        with:
          distribution: 'graalvm'
          java-version: ${{ matrix.java }}
          cache: "maven"

      - name: Configure Maven settings for GitHub Packages
        run: |
          mkdir -p ~/.m2
          cp "${{ github.workspace }}/.github/settings.xml" ~/.m2/settings.xml

      - name: Printing versions
        run: |
          echo "GRAALVM_HOME: $GRAALVM_HOME"
          echo "JAVA_HOME: $JAVA_HOME"
          java --version
          native-image --version

      - name: Build and analyze
        run: ./mvnw clean verify

      - if: ${{ github.ref == 'refs/heads/main' }}
        name: Verify Docker credentials
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSCODE: ${{ secrets.DOCKER_PASSCODE }}
        run: |
          if [ -z "$DOCKER_USERNAME" ] || [ -z "$DOCKER_PASSCODE" ]; then
            echo "Error: DOCKER_USERNAME or DOCKER_PASSCODE secret is not set"
            echo "Please add these secrets in: Settings → Secrets and variables → Actions"
            exit 1
          fi

      - if: ${{ github.ref == 'refs/heads/main' }}
        name: Login to DockerHub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSCODE }}

      - if: ${{ github.ref == 'refs/heads/main' }}
        name: Build and Push Docker Image
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          set -euo pipefail

          echo "=== Runner architecture ==="
          uname -m

          echo "=== Docker server architecture ==="
          docker info --format '{{.OSType}}/{{.Architecture}}'

          # config-server and order-service are published as native images.
          PROFILE=""
          if [ "$SERVICE" = "config-server" ] || [ "$SERVICE" = "order-service" ]; then
            PROFILE="-Pnative"
          fi
          
          ./mvnw $PROFILE spring-boot:build-image \
            -DskipTests \
            -Dspring-boot.build-image.builder="paketobuildpacks/builder-jammy-java-tiny:latest" \
            -Dspring-boot.build-image.imagePlatform=linux/amd64 \
            -Dspring-boot.build-image.pullPolicy=ALWAYS \
            -Dspring-boot.build-image.publish=true \
            -Dspring-boot.build-image.imageName="dockertmt/mmv2-${SERVICE}:latest"

