name: services

# One workflow for all services. The `plan` job works out which services a push or
# pull request affects (from dynamic-monorepo.config.json) and only those are built,
# tested and, on main, published as Docker images.
on:
  push:
    branches: [main]
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.plan.outputs.build }}
      has_services: ${{ steps.plan.outputs.has_build }}
    steps:
      - uses: actions/checkout@v7
      - uses: Continuous-Actions/dynamic-monorepo@v1
        id: plan

  build:
    name: ${{ matrix.service }} with jdk ${{ matrix.java }}
    needs: plan
    if: needs.plan.outputs.has_services == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.plan.outputs.services) }}
        java: ["25"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis

      - uses: graalvm/setup-graalvm@v1
        with:
          distribution: 'graalvm'
          java-version: ${{ matrix.java }}
          cache: "maven"

      - name: Printing versions
        run: |
          echo "GRAALVM_HOME: $GRAALVM_HOME"
          echo "JAVA_HOME: $JAVA_HOME"
          java --version
          native-image --version

      - name: Build and analyze
        run: ./mvnw clean verify

      - if: ${{ github.ref == 'refs/heads/main' }}
        name: Verify Docker credentials
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSCODE: ${{ secrets.DOCKER_PASSCODE }}
        run: |
          if [ -z "$DOCKER_USERNAME" ] || [ -z "$DOCKER_PASSCODE" ]; then
            echo "Error: DOCKER_USERNAME or DOCKER_PASSCODE secret is not set"
            echo "Please add these secrets in: Settings → Secrets and variables → Actions"
            exit 1
          fi

      - if: ${{ github.ref == 'refs/heads/main' }}
        name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSCODE }}

      - if: ${{ github.ref == 'refs/heads/main' }}
        name: Build and Push Docker Image
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          # config-server is published as a native image, as before.
          PROFILE=""
          if [ "$SERVICE" = "config-server" ]; then PROFILE="-Pnative"; fi
          ./mvnw $PROFILE spring-boot:build-image \
            -DskipTests \
            -Dspring-boot.build-image.publish=true \
            -Dspring-boot.build-image.imageName=dockertmt/mmv2-${SERVICE}:latest
