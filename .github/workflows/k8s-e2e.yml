name: Kubernetes E2E Tests

on:
  workflow_dispatch:
  push:
    paths:
      - 'deployment/k8s/**'
      - 'deployment/terraform/**'
      - '.github/workflows/k8s-e2e.yml'
    branches: [main]
  pull_request:
    paths:
      - 'deployment/k8s/**'
      - 'deployment/terraform/**'
      - '.github/workflows/k8s-e2e.yml'
    types:
      - opened
      - synchronize
      - reopened

jobs:
  terraform-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.17'

      - name: Terraform Format & Validation Check
        working-directory: deployment/terraform/keycloak
        run: |
          set -Eeuo pipefail
          terraform fmt -check
          terraform init -backend=false -lockfile=readonly
          terraform validate

  e2e-test:
    runs-on: ubuntu-latest
    needs: [terraform-validate]
    timeout-minutes: 45
    steps:
      - name: Checkout Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: 'temurin'
          cache: 'maven'

      - name: Create k8s Kind Cluster
        uses: helm/kind-action@v1.15.1
        with:
          cluster_name: kind
          config: deployment/k8s/kind-config.yaml

      - name: Install NGINX Ingress Controller
        run: |
          set -Eeuo pipefail
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.12.1/deploy/static/provider/kind/deploy.yaml
          kubectl wait --namespace ingress-nginx --for=condition=ready pod --selector=app.kubernetes.io/component=controller --timeout=120s

      - name: Obtain and Load Images
        run: |
          set -Eeuo pipefail
          
          # Build the Terraform runner image locally since it's not published to Docker Hub
          docker build -t dockertmt/mmv2-keycloak-terraform-runner:0.0.1-SNAPSHOT -f deployment/terraform/Dockerfile deployment/terraform/
          
          images=(
            dockertmt/mmv2-config-server:0.0.1-SNAPSHOT
            dockertmt/mmv2-service-registry-25:0.0.1-SNAPSHOT
            dockertmt/mmv2-api-gateway:0.0.1-SNAPSHOT
            dockertmt/mmv2-catalog-service:0.0.1-SNAPSHOT
            dockertmt/mmv2-inventory-service:0.0.1-SNAPSHOT
            dockertmt/mmv2-order-service:0.0.1-SNAPSHOT
            dockertmt/mmv2-payment-service:0.0.1-SNAPSHOT
            dockertmt/mmv2-retail-store-webapp:0.0.1-SNAPSHOT
            dockertmt/mmv2-keycloak-terraform-runner:0.0.1-SNAPSHOT
          )
          for image in "${images[@]}"; do
            if [[ "$image" != "dockertmt/mmv2-keycloak-terraform-runner"* ]]; then
              docker pull "$image"
            fi
            kind load docker-image "$image" --name kind
          done

      - name: Deploy CI Overlay
        run: |
          set -Eeuo pipefail
          ./deployment/k8s/deploy.sh ci

      - name: Validate NetworkPolicy and PDBs
        run: |
          set -Eeuo pipefail
          # Test PDB exists and is healthy
          kubectl get pdb -n retailstore api-gateway-pdb
          kubectl get pdb -n retailstore retail-store-webapp-pdb
          
          # Verify NetworkPolicies applied
          kubectl get networkpolicy -n retailstore default-deny-all
          kubectl get networkpolicy -n retailstore explicit-egress-for-apps

      - name: Validate Kafka Persistence
        run: |
          set -Eeuo pipefail
          kubectl exec -n retailstore statefulset/kafka -- /bin/bash -c "echo 'hello-kafka' | /opt/kafka/bin/kafka-console-producer.sh --bootstrap-server localhost:9092 --topic persistence-test"
          
          echo "Deleting Kafka Pod to test persistence..."
          kubectl delete pod kafka-0 -n retailstore
          
          kubectl rollout status statefulset/kafka -n retailstore --timeout=300s
          kubectl wait --namespace retailstore --for=condition=ready pod/kafka-0 --timeout=300s
          
          echo "Verifying Kafka data survived..."
          result=$(kubectl exec -n retailstore statefulset/kafka -- /bin/bash -c "/opt/kafka/bin/kafka-console-consumer.sh --bootstrap-server localhost:9092 --topic persistence-test --from-beginning --max-messages 1 --timeout-ms 10000")
          if [[ "$result" != *"hello-kafka"* ]]; then
            echo "Kafka persistence test failed. Did not find message."
            exit 1
          else
            echo "Kafka persistence test passed."
          fi

          echo "Allowing application consumers to reconnect and rebalance after Kafka restart..."
          sleep 10
      - name: Run E2E Validations
        run: |
          set -Eeuo pipefail
          
          echo "Waiting for keycloak-terraform-runner Job to complete..."
          kubectl wait --namespace retailstore --for=condition=complete job/keycloak-terraform-runner --timeout=120s
          echo "Keycloak Terraform runner completed."

          # Map hostnames for test
          if ! grep -Eq '(^|[[:space:]])retailstore\.local([[:space:]]|$)' /etc/hosts; then
            echo "127.0.0.1 retailstore.local keycloak.local api.retailstore.local jobrunr.local" | sudo tee -a /etc/hosts
          fi
          
          # E2E Java Module Validation
          TF_VAR_webapp_client_secret="${TF_VAR_webapp_client_secret:-$(kubectl get secret webapp-oauth2-credentials -n retailstore -o jsonpath='{.data.OAUTH2_CLIENT_SECRET}' | base64 --decode)}"
          KEYCLOAK_RETAIL_PASSWORD="${KEYCLOAK_RETAIL_PASSWORD:-$(kubectl get secret keycloak-user-passwords -n retailstore -o jsonpath='{.data.RETAIL_PASSWORD}' | base64 --decode)}"
          ./mvnw test -pl e2e-tests -DskipE2E=false \
            -Dbase.url=http://api.retailstore.local \
            -Dkeycloak.url=http://keycloak.local \
            "-Dkeycloak.client.secret=${TF_VAR_webapp_client_secret:-}" \
            "-Dkeycloak.password=${KEYCLOAK_RETAIL_PASSWORD:-}"

          # Request webapp via Ingress (best-effort smoke check; does not fail the job)
          if curl -s -f http://retailstore.local > /dev/null; then
            echo "Webapp reachable via ingress."
          else
            echo "::warning::Webapp smoke check via http://retailstore.local failed (non-fatal)."
          fi

          # OAuth2 Keycloak Test (best-effort smoke check; does not fail the job)
          if curl -s -f -X POST http://keycloak.local/realms/retailstore/protocol/openid-connect/token \
            -d "client_id=retailstore-webapp" \
            -d "client_secret=demo-throwaway-oauth-secret" \
            -d "grant_type=password" \
            -d "username=retail" \
            -d "password=retail1234" | grep -q access_token; then
            echo "Keycloak token endpoint returned access_token."
          else
            echo "::warning::Keycloak smoke check failed to obtain access_token (non-fatal)."
          fi

      - name: Validate Kafka Consumer Groups Protocol
        run: |
          set -Eeuo pipefail
          echo "Validating Kafka consumer groups protocol..."
          groups_output=$(kubectl exec -n retailstore statefulset/kafka -- /bin/bash -c "/opt/kafka/bin/kafka-groups.sh --bootstrap-server localhost:9092 --list")
          echo "Current Kafka groups:"
          echo "$groups_output"

          # Validate consumer protocol for payment, stock, and product
          for group in payment stock product; do
            if ! echo "$groups_output" | grep -E "^${group}[[:space:]]+.*[[:space:]]+consumer([[:space:]]|$)"; then
              echo "Error: Group '$group' is not using protocol 'consumer'."
              echo "$groups_output"
              exit 1
            fi
            echo "Group '$group' verified with protocol 'consumer'."
          done

          # Validate order-service remains a classic Streams consumer group
          if ! echo "$groups_output" | grep -E "^order-service[[:space:]]+.*[[:space:]]+classic([[:space:]]|$)"; then
            echo "Error: 'order-service' is not using classic protocol."
            echo "$groups_output"
            exit 1
          fi
          echo "Group 'order-service' verified with classic Streams protocol."

      - name: Publish E2E Test Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-test-reports
          path: e2e-tests/target/surefire-reports/


      - name: Validate Network Policies
        run: |
          set -Eeuo pipefail
          kubectl run test-api-gateway --rm -i --image=busybox:1.36 --labels="app=api-gateway" -n retailstore --restart=Never -- nc -z catalog-service 18080 || (echo "Allowed path failed" && exit 1)
          if kubectl run test-catalog-service --rm -i --image=busybox:1.36 --labels="app=catalog-service" -n retailstore --restart=Never -- nc -w 3 -z api-gateway 8765; then
            echo "Disallowed path succeeded!"
            exit 1
          else
            echo "Disallowed path blocked."
          fi

      - name: Validate PDBs and Node Drain
        run: |
          set -Eeuo pipefail
          kubectl get pdb -n retailstore catalog-service-pdb
          min_avail=$(kubectl get pdb -n retailstore catalog-service-pdb -o jsonpath="{.spec.minAvailable}")
          if [ "$min_avail" -ne 1 ]; then exit 1; fi

      - name: Validate Rollout and Deployment Strategy
        run: |
          set -Eeuo pipefail
          kubectl rollout restart deployment/catalog-service -n retailstore
          kubectl rollout status deployment/catalog-service -n retailstore --timeout=120s

      - name: Collect Diagnostics
        if: failure()
        run: |
          set +e
          mkdir -p k8s-diagnostics
          kubectl get pods -A > k8s-diagnostics/pods.txt
          kubectl get events -A > k8s-diagnostics/events.txt
          kubectl get deployments,statefulsets,services -n retailstore > k8s-diagnostics/resources.txt
          kubectl describe pods -A > k8s-diagnostics/pods-describe.txt
          kubectl describe deployments,statefulsets -n retailstore > k8s-diagnostics/workloads-describe.txt
          for resource in \
            statefulset/postgresql \
            deployment/redis \
            statefulset/kafka \
            deployment/keycloak \
            deployment/config-server \
            deployment/service-registry \
            deployment/catalog-service \
            deployment/inventory-service \
            deployment/order-service \
            deployment/payment-service \
            deployment/api-gateway \
            deployment/retail-store-webapp; do
            kubectl rollout status "$resource" -n retailstore --timeout=5s > "k8s-diagnostics/${resource//\//-}-rollout.txt" 2>&1
          done
          
          for pod in $(kubectl get pods -n retailstore -o name); do
            # Replace / in pod name (like pod/my-pod) with _ for filename
            clean_pod=$(echo $pod | tr '/' '_')
            kubectl logs $pod -n retailstore --all-containers > k8s-diagnostics/$clean_pod.log || true
          done

      - name: Upload Diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: k8s-diagnostics
          path: k8s-diagnostics/

      - name: Teardown Cluster
        if: always()
        run: |
          kind delete cluster --name kind
