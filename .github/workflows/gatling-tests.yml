name: gatling-tests

on:
  workflow_dispatch:
  push:
    paths:
      - "gatling-tests/**"
    branches: [main]
  pull_request:
    paths:
      - "gatling-tests/**"
    types:
      - opened
      - synchronize
      - reopened

jobs:
  build:
    name: Run Unit & Integration Tests with jdk  ${{ matrix.java }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "gatling-tests"
    strategy:
      matrix:
        java: ["25"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5.7.0
        with:
          java-version: ${{ matrix.java }}
          distribution: "temurin"
          cache: "maven"

      - name: Start up softwares via Docker Compose
        run: |
          pwd
          cd ..
          cd deployment
          docker compose up -d postgresql redis grafana-lgtm otel-collector kafka config-server naming-server api-gateway catalog-service inventory-service order-service payment-service 
          sleep 60
          docker ps -a

      - name: Build and analyze (scripted)
        run: |
          echo "Running Gatling tests via run-tests.sh"
          chmod +x ./run-tests.sh || true
          ./run-tests.sh

      - name: Upload Gatling Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gatling-reports
          path: gatling-tests/target/gatling/
