name: Publish Common Library

on:
  push:
    branches:
      - main
    paths:
      - 'common/**'
      - '.github/workflows/publish-common.yml'
    tags:
      - 'common-v*'
  pull_request:
    paths:
      - 'common/**'
      - '.github/workflows/publish-common.yml'
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version (leave blank to publish current POM version)'
        required: false
        type: string

permissions:
  contents: write
  packages: write

jobs:
  build-and-test:
    name: Build & Verify Common
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Verify Spotless & Compile
        run: ./mvnw -pl common clean test spotless:check

  publish:
    name: Publish to GitHub Packages
    needs: build-and-test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java 25 & Maven Settings
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          server-id: github
          cache: 'maven'

      - name: Set Release Version (if tagged or dispatched)
        if: startsWith(github.ref, 'refs/tags/common-v') || inputs.release_version != ''
        run: |
          VERSION="${{ inputs.release_version }}"
          if [ -z "$VERSION" ]; then
            TAG="${{ github.ref_name }}"
            VERSION="${TAG#common-v}"
          fi
          echo "Setting common version to $VERSION"
          ./mvnw -pl common versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false

      - name: Deploy Common to GitHub Packages
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./mvnw -B -pl common deploy -s .github/settings.xml -Daether.remoteRepositoryFilter.prefixes=false -DskipTests

  publish-central:
    name: Publish to Maven Central
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/common-v') || (github.event_name == 'workflow_dispatch' && inputs.release_version != '')
    permissions:
      contents: write
    concurrency:
      group: publish-central-${{ inputs.release_version || github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify Maven Central & GPG secrets
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ -z "$CENTRAL_USERNAME" ] || [ -z "$CENTRAL_PASSWORD" ] || [ -z "$GPG_PRIVATE_KEY" ] || [ -z "$GPG_PASSPHRASE" ]; then
            echo "Error: CENTRAL_USERNAME, CENTRAL_PASSWORD, GPG_PRIVATE_KEY, or GPG_PASSPHRASE secret is not set"
            echo "Please add these secrets in: Settings → Secrets and variables → Actions"
            exit 1
          fi

      - name: Guard Release Version
        run: |
          VERSION="${{ inputs.release_version }}"
          if [ -z "$VERSION" ]; then
            TAG="${{ github.ref_name }}"
            VERSION="${TAG#common-v}"
          fi
          if [ -z "$VERSION" ]; then
            echo "Error: Release version is empty. A valid version must be specified."
            exit 1
          fi
          if [[ "$VERSION" == *-SNAPSHOT ]]; then
            echo "Error: Release version '$VERSION' must not end with -SNAPSHOT for Maven Central publication."
            exit 1
          fi

      - name: Set up Java 25 & GPG
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Set Release Version
        run: |
          VERSION="${{ inputs.release_version }}"
          if [ -z "$VERSION" ]; then
            TAG="${{ github.ref_name }}"
            VERSION="${TAG#common-v}"
          fi
          echo "Setting common version to $VERSION"
          ./mvnw -pl common versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false

      - name: Deploy Common to Maven Central
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: ./mvnw -B -pl common deploy -Prelease -s .github/settings.xml -Daether.remoteRepositoryFilter.prefixes=false -DskipTests

      - name: Create and Push Git Tag (if released via workflow_dispatch)
        if: github.event_name == 'workflow_dispatch' && inputs.release_version != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="common-v${{ inputs.release_version }}"
          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "Tag $TAG_NAME already exists, skipping tag creation."
          else
            echo "Creating tag $TAG_NAME"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG_NAME" -m "Release $TAG_NAME"
            git push origin "$TAG_NAME"
          fi
