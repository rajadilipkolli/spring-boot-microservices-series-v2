server:
  http_listen_port: 3100
  http_listen_address: 0.0.0.0
  http_server_read_timeout: 30s
  http_server_write_timeout: 30s

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
    jaeger:
      protocols:
        thrift_http: null
        grpc: null
        thrift_binary: null
        thrift_compact: null
    zipkin:
      endpoint: 0.0.0.0:9411
querier:
  search:
    query_timeout: 30s
metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /tmp/tempo/generator/wal
    remote_write:
    - url: http://host.docker.internal:9090/api/v1/write
      send_exemplars: true
query_frontend:
  metrics:
    concurrent_jobs: 8
    target_bytes_per_job: 1250000000.0
    max_duration: 3h
storage:
  trace:
    backend: local
    wal:
      path: /tmp/tempo/wal
    local:
      path: /tmp/tempo/blocks
    block:
      version: vParquet4
overrides:
  defaults:
    metrics_generator:
      processors:
      - service-graphs
      - span-metrics
usage_report:
  reporting_enabled: false
stream_over_http_enabled: true
