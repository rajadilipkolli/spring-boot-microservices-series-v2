apiVersion: apps/v1
kind: Deployment
metadata:
  name: apicurio-registry
  namespace: retailstore
spec:
  replicas: 1
  selector:
    matchLabels:
      app: apicurio-registry
  template:
    metadata:
      labels:
        app: apicurio-registry
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: apicurio-registry
        image: apicurio/apicurio-registry-mem:2.4.1.Final
        ports:
        - containerPort: 8080
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          readOnlyRootFilesystem: true
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: schema-registry
  namespace: retailstore
spec:
  ports:
  - port: 8080
    targetPort: 8080
  selector:
    app: apicurio-registry
