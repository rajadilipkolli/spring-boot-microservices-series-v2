apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../hardening-base
- cluster-issuer.yaml
- https-redirect.yaml
- keycloak-internal-tls.yaml
- postgresql-ha.yaml
- kafka-ha.yaml
- apicurio-registry.yaml
- strimzi-operator.yaml
- keycloak-discovery.yaml
- secrets/external-secrets.yaml
# Terraform runner Job, RBAC, and ServiceAccount for declarative realm management.
patches:
- path: backend-traffic-policy.yaml
- path: gateway-tls.yaml
- target:
    kind: HTTPRoute
    name: (retailstore-webapp-route|api-gateway-route|keycloak-route|internal-jobrunr-route)
  patch: |-
    - op: add
      path: /spec/parentRefs/0/sectionName
      value: https
- path: webapp-https.yaml
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: api-gateway
      namespace: retailstore
    spec:
      template:
        spec:
          containers:
          - name: api-gateway
            env:
            - name: KEYCLOAK_ISSUER_URI
              value: https://keycloak.local/realms/retailstore
- patch: |-
    $patch: delete
    apiVersion: v1
    kind: Secret
    metadata:
      name: jobrunr-auth
      namespace: retailstore
- patch: |-
    $patch: delete
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: patch-webapp-hostaliases
      namespace: retailstore
- target:
    kind: Deployment
  patch: |-
    - op: replace
      path: /spec/replicas
      value: 1
- target:
    kind: Service
    name: keycloak
  patch: |-
    - op: add
      path: /spec/ports/-
      value:
        name: https
        port: 8443
        targetPort: 8443

- target:
    kind: StatefulSet
    name: postgresql
  patch: |
    $patch: delete
    apiVersion: apps/v1
    kind: StatefulSet
    metadata:
      name: postgresql
- target:
    kind: StatefulSet
    name: kafka
  patch: |
    $patch: delete
    apiVersion: apps/v1
    kind: StatefulSet
    metadata:
      name: kafka
- path: postgres-alias.yaml
- path: kafka-alias.yaml
# Add prod Keycloak settings and TLS only after the index-based realm import
# removal above, so the removal cannot target the TLS volume by mistake.
- path: keycloak-ha-patch.yaml
- path: keycloak-terraform-job-patch.yaml
