apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../hardening-base
- cluster-issuer.yaml
- keycloak-internal-tls.yaml
- postgresql-ha.yaml
- kafka-ha.yaml
- apicurio-registry.yaml
- strimzi-operator.yaml
- keycloak-discovery.yaml
- secrets/external-secrets.yaml
# Terraform runner Job, RBAC, and ServiceAccount for declarative realm management.
- keycloak-terraform-job.yaml
patches:
- target:
    kind: Deployment
  patch: |-
    - op: replace
      path: /spec/replicas
      value: 1
- target:
    kind: Service
    name: keycloak
  patch: |-
    - op: add
      path: /spec/ports/-
      value:
        name: https
        port: 8443
        targetPort: 8443
- path: ingress-patch.yaml
  target:
    kind: Ingress
    name: retailstore-ingress
- target:
    kind: StatefulSet
    name: postgresql
  patch: |
    $patch: delete
    apiVersion: apps/v1
    kind: StatefulSet
    metadata:
      name: postgresql
- target:
    kind: StatefulSet
    name: kafka
  patch: |
    $patch: delete
    apiVersion: apps/v1
    kind: StatefulSet
    metadata:
      name: kafka
- path: postgres-alias.yaml
- path: kafka-alias.yaml
# Delete the static realm ConfigMap from prod — the Terraform runner Job
# manages the realm declaratively instead.
- target:
    kind: ConfigMap
    name: keycloak-realm-config
  patch: |
    $patch: delete
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: keycloak-realm-config
# Remove the realm-config volumeMount (index 0) from the Keycloak container.
# The --import-realm arg is removed via keycloak-ha-patch.yaml.
# JSON 6902 patches are required because strategic-merge cannot delete list
# elements — it can only add or update them.
- target:
    group: apps
    version: v1
    kind: Deployment
    name: keycloak
  patch: |-
    - op: remove
      path: /spec/template/spec/containers/0/volumeMounts/0
    - op: remove
      path: /spec/template/spec/volumes/0
# Add prod Keycloak settings and TLS only after the index-based realm import
# removal above, so the removal cannot target the TLS volume by mistake.
- path: keycloak-ha-patch.yaml
