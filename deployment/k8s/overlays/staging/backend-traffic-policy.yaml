apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: staging-traffic-policy
  namespace: retailstore
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: retailstore-gateway
  timeout:
    tcp:
      connectTimeout: 10s
    http:
      requestTimeout: 120s
  rateLimit:
    type: Local
    local:
      rules:
        - clientSelectors:
            - sourceCIDR:
                type: Distinct
                value: 0.0.0.0/0
          limit:
            requests: 20
            unit: Second
