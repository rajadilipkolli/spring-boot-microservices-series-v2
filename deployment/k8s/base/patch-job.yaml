apiVersion: v1
kind: ServiceAccount
metadata:
  name: webapp-patcher
  namespace: retailstore
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: webapp-patcher-role
  namespace: retailstore
rules:
- apiGroups: [""]
  resources: ["services"]
  verbs: ["get"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: webapp-patcher-binding
  namespace: retailstore
subjects:
- kind: ServiceAccount
  name: webapp-patcher
roleRef:
  kind: Role
  name: webapp-patcher-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: patch-webapp-hostaliases
  namespace: retailstore
spec:
  template:
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      serviceAccountName: webapp-patcher
      restartPolicy: OnFailure
      containers:
      - name: patcher
        image: bitnami/kubectl:latest
        command:
        - /bin/bash
        - -c
        - |
          echo "Waiting for keycloak service..."
          while ! kubectl get svc keycloak > /dev/null 2>&1; do sleep 2; done
          IP=$(kubectl get svc keycloak -o jsonpath='{.spec.clusterIP}')
          echo "Keycloak IP is $IP. Waiting for at least one keycloak pod to be Ready..."
          until kubectl get pods -l app=keycloak -n retailstore -o jsonpath='{.items[*].status.containerStatuses[*].ready}' 2>/dev/null | grep -q "true"; do
            echo "  keycloak not ready yet, sleeping 5s..."
            sleep 5
          done
          echo "Keycloak is ready. Patching retail-store-webapp hostAliases..."
          kubectl patch deployment retail-store-webapp -p "{\"spec\":{\"template\":{\"spec\":{\"hostAliases\":[{\"ip\":\"$IP\",\"hostnames\":[\"keycloak.local\"]}]}}}}"
          echo "Patch complete."
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
