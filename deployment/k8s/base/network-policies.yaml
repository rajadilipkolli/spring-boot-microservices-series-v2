apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: retailstore
spec:
  egress:
  - ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
    - port: 443
      protocol: TCP
    - port: 6443
      protocol: TCP
    - port: 8443
      protocol: TCP
  ingress: []
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-apps
  namespace: retailstore
spec:
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
  podSelector:
    matchExpressions:
    - key: app
      operator: In
      values:
      - api-gateway
      - retail-store-webapp
      - keycloak
  policyTypes:
  - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-apps-to-infrastructure
  namespace: retailstore
spec:
  ingress:
  - from:
    - podSelector:
        matchExpressions:
        - key: app
          operator: In
          values:
          - catalog-service
          - inventory-service
          - order-service
          - payment-service
          - api-gateway
          - retail-store-webapp
          - keycloak
          - service-registry
  podSelector:
    matchExpressions:
    - key: app
      operator: In
      values:
      - postgresql
      - redis
      - kafka
      - config-server
      - service-registry
      - keycloak
  policyTypes:
  - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-apps-to-cnpg-and-strimzi
  namespace: retailstore
spec:
  ingress:
  - from:
    - podSelector: {}
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: cnpg-system
  podSelector:
    matchExpressions:
    - key: cnpg.io/cluster
      operator: Exists
  policyTypes:
  - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-apps-to-strimzi
  namespace: retailstore
spec:
  ingress:
  - from:
    - podSelector: {}
  podSelector:
    matchExpressions:
    - key: strimzi.io/cluster
      operator: Exists
  policyTypes:
  - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kafka-to-kafka
  namespace: retailstore
spec:
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: kafka
    ports:
    - port: 9092
      protocol: TCP
    - port: 9093
      protocol: TCP
  podSelector:
    matchLabels:
      app: kafka
  policyTypes:
  - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: explicit-egress-for-apps
  namespace: retailstore
spec:
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: retailstore
  - ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
    - port: 443
      protocol: TCP
    - port: 6443
      protocol: TCP
    - port: 8443
      protocol: TCP
  podSelector: {}
  policyTypes:
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-all-apps-to-shared-services
  namespace: retailstore
spec:
  ingress:
  - from:
    - podSelector:
        matchExpressions:
        - key: app
          operator: In
          values:
          - catalog-service
          - inventory-service
          - order-service
          - payment-service
          - retail-store-webapp
          - api-gateway
          - keycloak
          - service-registry
  podSelector:
    matchExpressions:
    - key: app
      operator: In
      values:
      - keycloak
      - config-server
      - service-registry
  policyTypes:
  - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-webapp-to-gateway
  namespace: retailstore
spec:
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: retail-store-webapp
  podSelector:
    matchLabels:
      app: api-gateway
  policyTypes:
  - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-to-internal
  namespace: retailstore
spec:
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: api-gateway
  podSelector:
    matchExpressions:
    - key: app
      operator: In
      values:
      - catalog-service
      - inventory-service
      - order-service
      - payment-service
  policyTypes:
  - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-internal-to-internal
  namespace: retailstore
spec:
  ingress:
  - from:
    - podSelector:
        matchExpressions:
        - key: app
          operator: In
          values:
          - catalog-service
          - inventory-service
          - order-service
          - payment-service
  podSelector:
    matchExpressions:
    - key: app
      operator: In
      values:
      - catalog-service
      - inventory-service
      - order-service
      - payment-service
  policyTypes:
  - Ingress
