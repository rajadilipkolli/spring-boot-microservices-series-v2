apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: retailstore
spec:
  ports:
  - port: 8765
    targetPort: 8765
  selector:
    app: api-gateway
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: retailstore
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - env:
        - name: CONFIG_SERVER_USR
          valueFrom:
            secretKeyRef:
              key: CONFIG_SERVER_USR
              name: config-server-credentials
        - name: CONFIG_SERVER_PWD
          valueFrom:
            secretKeyRef:
              key: CONFIG_SERVER_PWD
              name: config-server-credentials
        - name: SPRING_CONFIG_IMPORT
          value: optional:configserver:http://$(CONFIG_SERVER_USR):$(CONFIG_SERVER_PWD)@config-server:8888/
        - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
          value: http://service-registry:8761/eureka/
        - name: SERVER_FORWARD_HEADERS_STRATEGY
          value: framework
        - name: CONFIG_SERVER
          value: http://$(CONFIG_SERVER_USR):$(CONFIG_SERVER_PWD)@$(CONFIG_SERVER_HOST):$(CONFIG_SERVER_PORT)
        - name: SPRING_DATA_REDIS_HOST
          value: redis
        - name: JAVA_TOOL_OPTIONS
          value: -XX:MaxDirectMemorySize=256m -Xmx400m
        envFrom:
        - configMapRef:
            name: shared-config
        image: dockertmt/mmv2-api-gateway:0.0.1-SNAPSHOT
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8765
          initialDelaySeconds: 5
          periodSeconds: 10
        name: api-gateway
        ports:
        - containerPort: 8765
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8765
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            memory: 1400Mi
          requests:
            memory: 512Mi
        startupProbe:
          failureThreshold: 30
          httpGet:
            path: /actuator/health/liveness
            port: 8765
          periodSeconds: 10
      initContainers:
      - command:
        - sh
        - -c
        - 'until nc -z config-server 8888; do echo waiting for config-server; sleep
          2; done;

          until nc -z service-registry 8761; do echo waiting for service-registry;
          sleep 2; done;

          '
        image: busybox:1.36
        name: wait-for-dependencies
