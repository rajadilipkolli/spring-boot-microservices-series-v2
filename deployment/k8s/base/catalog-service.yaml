apiVersion: v1
kind: Service
metadata:
  name: catalog-service
  namespace: retailstore
spec:
  ports:
  - port: 18080
    targetPort: 18080
  selector:
    app: catalog-service
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-service
  namespace: retailstore
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog-service
  template:
    metadata:
      labels:
        app: catalog-service
    spec:
      containers:
      - env:
        - name: CONFIG_SERVER_USR
          valueFrom:
            secretKeyRef:
              key: CONFIG_SERVER_USR
              name: config-server-credentials
        - name: CONFIG_SERVER_PWD
          valueFrom:
            secretKeyRef:
              key: CONFIG_SERVER_PWD
              name: config-server-credentials
        - name: SPRING_CONFIG_IMPORT
          value: optional:configserver:http://$(CONFIG_SERVER_USR):$(CONFIG_SERVER_PWD)@config-server:8888/
        - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
          value: kafka:9092
        - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
          value: http://service-registry:8761/eureka/
        - name: SPRING_R2DBC_URL
          value: r2dbc:postgresql://postgresql:5432/appdb
        - name: SPRING_R2DBC_USERNAME
          valueFrom:
            secretKeyRef:
              key: POSTGRES_USER
              name: postgres-credentials
        - name: SPRING_R2DBC_PASSWORD
          valueFrom:
            secretKeyRef:
              key: POSTGRES_PASSWORD
              name: postgres-credentials
        - name: SPRING_LIQUIBASE_URL
          value: jdbc:postgresql://postgresql:5432/appdb
        - name: SPRING_LIQUIBASE_USER
          valueFrom:
            secretKeyRef:
              key: POSTGRES_USER
              name: postgres-credentials
        - name: SPRING_LIQUIBASE_PASSWORD
          valueFrom:
            secretKeyRef:
              key: POSTGRES_PASSWORD
              name: postgres-credentials
        - name: JAVA_TOOL_OPTIONS
          value: -XX:MaxDirectMemorySize=256m -Xmx400m
        - name: APPLICATION_INVENTORY_SERVICE_URL
          value: http://inventory-service:18181/inventory-service
        - name: OTEL_SERVICE_NAME
          value: catalog-service
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: service.name=catalog-service,service.version=0.0.1-SNAPSHOT
        envFrom:
        - configMapRef:
            name: shared-config
        image: dockertmt/mmv2-catalog-service:0.0.1-SNAPSHOT
        livenessProbe:
          httpGet:
            path: /catalog-service/actuator/health/liveness
            port: 18080
          initialDelaySeconds: 5
          periodSeconds: 10
        name: catalog-service
        ports:
        - containerPort: 18080
        readinessProbe:
          httpGet:
            path: /catalog-service/actuator/health/readiness
            port: 18080
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 1000m
            memory: 1400Mi
          requests:
            cpu: 200m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        startupProbe:
          failureThreshold: 30
          httpGet:
            path: /catalog-service/actuator/health/liveness
            port: 18080
          periodSeconds: 10
        volumeMounts:
        - mountPath: /tmp
          name: tmp-volume
      initContainers:
      - command:
        - sh
        - -c
        - 'until wget -q -O /dev/null http://config-server:8888/actuator/health/readiness
          2>/dev/null; do echo waiting for config-server; sleep 3; done;

          until nc -z service-registry 8761; do echo waiting for service-registry;
          sleep 2; done;

          until nc -z postgresql 5432; do echo waiting for postgresql; sleep 2; done;

          until nc -z kafka 9092; do echo waiting for kafka; sleep 2; done;

          '
        image: busybox:1.36
        name: wait-for-dependencies
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: catalog-service
      volumes:
      - emptyDir: {}
        name: tmp-volume
