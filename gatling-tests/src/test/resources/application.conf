simulation {
  baseUrl = "http://localhost:8765"
  baseUrl = ${?baseUrl}

  load {
    rampUsers = 5
    rampUsers = ${?rampUsers}
    
    constantUsers = 10
    constantUsers = ${?constantUsers}
    
    rampDuration = 30
    rampDuration = ${?rampDuration}
    
    testDuration = 60
    testDuration = ${?testDuration}
    
    burstUsersPerSec = 30
    burstUsersPerSec = ${?burstUsersPerSec}
  }
  sla {
    # Response time thresholds (milliseconds) — override via -DslaMean, -DslaP95, etc.
    meanMs = 5000
    meanMs = ${?slaMean}

    p95Ms = 15000
    p95Ms = ${?slaP95}

    p99Ms = 20000
    p99Ms = ${?slaP99}

    # Stress-profile tighter thresholds
    stressMeanMs = 1500
    stressMeanMs = ${?slaStressMean}

    stressP95Ms = 3000
    stressP95Ms = ${?slaStressP95}

    stressP99Ms = 5000
    stressP99Ms = ${?slaStressP99}

    # Resilience / gateway thresholds
    resilienceP95Ms = 3000
    resilienceP95Ms = ${?slaResilienceP95}

    gatewayP99Ms = 4000
    gatewayP99Ms = ${?slaGatewayP99}

    # Max error rate (percent)
    maxErrorPercent = 5.0
    maxErrorPercent = ${?slaMaxErrorPercent}

    # Min success rate (percent)
    minSuccessPercent = 95.0
    minSuccessPercent = ${?slaMinSuccessPercent}
  }
}
