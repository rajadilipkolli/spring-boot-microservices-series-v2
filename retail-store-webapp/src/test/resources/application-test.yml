spring:
  security:
    oauth2:
      client:
        provider:
          keycloak:
            issuer-uri: http://test-auth-server
            user-name-attribute: preferred_username
        registration:
          keycloak:
            client-id: test-client-id
            client-secret: test-client-secret
            scope:
              - openid
              - profile

logging:
  level:
    org.springframework.web.client: DEBUG
    com.github.tomakehurst.wiremock: DEBUG
