<!DOCTYPE html>
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Register - RetailStore</title>
    <style>
        .registration-container {
            max-width: 500px;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
            margin: 20px auto 0;
        }
    </style>
</head>
<body>
<div layout:fragment="content">
    <div class="registration-container">
        <h2 class="text-center mb-4">Create Account</h2>
        <form id="registrationForm">
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" class="form-control" id="username" name="username" required>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" name="email" required>
            </div>
            <div class="mb-3">
                <label for="firstName" class="form-label">First Name</label>
                <input type="text" class="form-control" id="firstName" name="firstName" required>
            </div>
            <div class="mb-3">
                <label for="lastName" class="form-label">Last Name</label>
                <input type="text" class="form-control" id="lastName" name="lastName" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" name="password" required>
            </div>
            <div class="mb-3">
                <label for="confirmPassword" class="form-label">Confirm Password</label>
                <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" required>
            </div>
            <div class="mb-3">
                <label for="phone" class="form-label">Phone</label>
                <input type="tel" class="form-control" id="phone" name="phone">
            </div>
            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="addressLine1" class="form-label">Delivery Address Line 1</label>
                    <input type="text" class="form-control" id="addressLine1" name="addressLine1" required>
                </div>
                <div class="col-md-6">
                    <label for="addressLine2" class="form-label">Delivery Address Line 2</label>
                    <input type="text" class="form-control" id="addressLine2" name="addressLine2">
                </div>
            </div>
            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="city" class="form-label">Delivery Address City</label>
                    <input type="text" class="form-control" id="city" name="city" required>
                </div>
                <div class="col-md-6">
                    <label for="state" class="form-label">Delivery Address State</label>
                    <input type="text" class="form-control" id="state" name="state" required>
                </div>
            </div>
            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="zipCode" class="form-label">Delivery Address ZipCode</label>
                    <input type="text" class="form-control" id="zipCode" name="zipCode" required>
                </div>
                <div class="col-md-6">
                    <label for="country" class="form-label">Delivery Address Country</label>
                    <input type="text" class="form-control" id="country" name="country" required>
                </div>
            </div>
            <div id="registrationError" class="alert alert-danger d-none"></div>
            <div class="d-grid gap-2">
                <button type="button" class="btn btn-primary" id="registerButton">Register</button>
            </div>
        </form>
    </div>
</div>

<div layout:fragment="pageScripts">
    <script src="/js/registration.js"></script>
</div>
</body>
</html>
